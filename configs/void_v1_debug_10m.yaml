# void_v1 — Debug configuration (~10M params)
# Purpose: end-to-end pipeline validation on a laptop / Mac in seconds per step.
# All architectural components (diff-attn, MTP, register tokens, QK-norm)
# are present but at a tiny scale so the whole training loop can be exercised
# quickly before spending real compute.

model:
  hidden_dim:            128
  num_layers:            4
  num_query_heads:       4
  num_kv_heads:          2           # GQA 2:1
  head_dim:              32
  ffn_intermediate_dim:  384
  vocab_size:            8192
  max_seq_len:           256
  tie_word_embeddings:   true
  rope_theta:            10000.0
  rms_norm_eps:          1.0e-5
  qk_norm:               true
  attention_type:        differential_gqa
  differential:
    lambda_init_decay:   0.3
    lambda_init_base:    0.8
    tie_v_across_branches: true
  attention_pattern:
    - full
    - full
    - full
    - full
  sliding_window_size:   128
  num_register_tokens:   2
  mtp:
    enabled:             true
    num_heads:           2
    loss_weights:        [0.3, 0.3]
    tie_output_head:     true
    per_head_transformer_layers: 1
  ffn_activation:        swiglu
  init:
    std:                 0.02
    scale_residual_projs_by: 1_over_sqrt_2L
  dtype:                 float32       # use fp32 for CPU/MPS debug
  master_weights_dtype:  float32

training:
  seq_len:               256
  micro_batch_size:      4
  grad_accum_steps:      1
  total_tokens:          10_000_000    # 10M tokens for smoke test
  optimizer:
    hidden:
      name:              adamw          # skip Muon for debug to reduce moving parts
      lr:                3.0e-4
      betas:             [0.9, 0.95]
      eps:               1.0e-8
      weight_decay:      0.1
    embed_head_norm:
      name:              adamw
      lr:                3.0e-4
      betas:             [0.9, 0.95]
      eps:               1.0e-8
      weight_decay:      0.1
  scheduler:
    warmup_steps:        100
    schedule:            cosine
    min_lr_fraction:     0.1
  grad_clip_norm:        1.0
  z_loss_coeff:          1.0e-4
  seed:                  42
  checkpoint:
    interval_steps:      500
    keep_last_n:         2
    push_to_hub:         false
  logging:
    log_interval_steps:  10
    wandb:
      project:           null           # local-only for debug
  use_flash_attention:   false          # SDPA baseline
  use_liger_kernel:      false
  gradient_checkpointing: false

curriculum:
  stages:
    - name:              debug_single_stage
      target_tokens:     10_000_000
      data_mix_config:   configs/data_mix_debug.yaml
      lr_schedule_phase: cosine_full

data:
  tokenizer_repo:        null           # use local BPE trained on debug corpus
  corpus_repo:           null
  streaming:             false
  num_workers:           2
  prefetch_factor:       2

evaluation:
  benchmarks:            []             # skip real evals during debug
  eval_at_steps:         []

post_training:
  sft:
    enabled:             false
  dpo:
    enabled:             false
