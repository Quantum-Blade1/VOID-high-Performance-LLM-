model:
  dim: 128
  n_layers: 4
  n_heads: 4
  n_kv_heads: 2
  head_dim: 32
  ffn_dim: 384
  vocab_size: 8192
  max_seq_len: 256
  rope_theta: 10000.0
  attn_kind: diff-gqa
  attn_pattern: [full, full, full, full]
  n_registers: 2
  n_mtp_heads: 2

train:
  seq_len: 256
  micro_batch: 4
  grad_accum: 1
  total_tokens: 10_000_000
  dtype: float32
  grad_ckpt: false
  flash_attn: false
  liger: false

  optim:
    hidden_kind: adamw
    hidden_lr: 3.0e-4
    other_lr: 3.0e-4
    warmup_steps: 100
    grad_clip: 1.0

  ckpt_interval: 500
  ckpt_keep: 2
  log_interval: 10
