# void_v1 — Full 485M configuration
# See paper/void_v1.tex §3 and docs/architecture.md for derivations.

model:
  # ---- Shape ----
  hidden_dim:            960
  num_layers:            32
  num_query_heads:       15
  num_kv_heads:          5           # GQA 3:1
  head_dim:              64
  ffn_intermediate_dim:  2560        # SwiGLU, ratio ~2.67x hidden
  vocab_size:            49152
  max_seq_len:           2048
  tie_word_embeddings:   true

  # ---- Positional ----
  rope_theta:            500000.0    # extended base for post-hoc context extension
  rope_scaling:          null

  # ---- Norm ----
  rms_norm_eps:          1.0e-5
  qk_norm:               true        # QK-norm on both diff-attn branches

  # ---- Attention ----
  attention_type:        differential_gqa      # standard_gqa | differential_gqa
  differential:
    lambda_init_decay:   0.3                   # controls initial lambda per layer
    lambda_init_base:    0.8                   # lambda(l=1) = base - decay*exp(...)
    tie_v_across_branches: true                # single V projection shared by both softmax outputs

  # ---- Mixed attention pattern ----
  # Length must equal num_layers. Values: 'full' | 'sliding_window'
  attention_pattern:
    - full        # L1
    - full        # L2
    - full        # L3
    - full        # L4
    - sliding_window  # L5
    - sliding_window  # L6
    - sliding_window  # L7
    - full            # L8
    - sliding_window  # L9
    - sliding_window  # L10
    - sliding_window  # L11
    - full            # L12
    - sliding_window  # L13
    - sliding_window  # L14
    - sliding_window  # L15
    - full            # L16
    - sliding_window  # L17
    - sliding_window  # L18
    - sliding_window  # L19
    - full            # L20
    - sliding_window  # L21
    - sliding_window  # L22
    - sliding_window  # L23
    - full            # L24
    - full            # L25
    - full            # L26
    - full            # L27
    - full            # L28
    - full            # L29
    - full            # L30
    - full            # L31
    - full            # L32
  sliding_window_size:   512

  # ---- Register tokens ----
  num_register_tokens:   4

  # ---- Multi-Token Prediction (train-only) ----
  mtp:
    enabled:             true
    num_heads:           2                     # predict t+2, t+3
    loss_weights:        [0.3, 0.3]
    tie_output_head:     true                  # MTP shares LM head weights
    per_head_transformer_layers: 1

  # ---- FFN activation ----
  ffn_activation:        swiglu

  # ---- Init ----
  init:
    std:                 0.02
    scale_residual_projs_by: 1_over_sqrt_2L    # 1 / sqrt(2 * num_layers)

  # ---- Precision ----
  dtype:                 bfloat16
  master_weights_dtype:  float32

training:
  # ---- Batch / sequence ----
  seq_len:               2048
  micro_batch_size:      8
  grad_accum_steps:      32                    # effective batch = 256 seqs ≈ 524k tokens/step
  total_tokens:          100_000_000_000       # 100B
  # steps = total_tokens / (micro_batch * grad_accum * seq_len) ≈ 190,735

  # ---- Optimizer split ----
  optimizer:
    hidden:
      name:              muon
      lr:                6.0e-4                # Muon typically uses higher LR than AdamW
      momentum:          0.95
      newton_schulz_iters: 5
    embed_head_norm:
      name:              adamw
      lr:                3.0e-4
      betas:             [0.9, 0.95]
      eps:               1.0e-8
      weight_decay:      0.1

  # ---- LR schedule ----
  scheduler:
    warmup_steps:        2000
    schedule:            cosine
    min_lr_fraction:     0.1                   # min_lr = 0.1 * peak_lr

  # ---- Grad clipping / stability ----
  grad_clip_norm:        1.0
  z_loss_coeff:          1.0e-4

  # ---- Determinism / seed ----
  seed:                  42

  # ---- Checkpointing ----
  checkpoint:
    interval_steps:      1000
    keep_last_n:         5
    milestones_step:     [20000, 50000, 85000, 95000, 100000]  # extrapolated; adjust after step count is finalized
    push_to_hub:         true
    hub_repo:            "Quantum-Blade1/void-v1-base"
    hub_private_until_release: true

  # ---- Logging ----
  logging:
    log_interval_steps:  50
    wandb:
      project:           "void-v1"
      entity:            null

  # ---- Precision / kernels ----
  use_flash_attention:   true        # falls back to SDPA if flash-attn not installed
  use_liger_kernel:      true        # fused RMSNorm, SwiGLU, cross-entropy
  gradient_checkpointing: true
  gradient_checkpoint_every_n_layers: 4

curriculum:
  # Three-stage annealing (see paper §5.2)
  stages:
    - name:              stage_1_broad
      target_tokens:     85_000_000_000
      data_mix_config:   configs/data_mix_stage1.yaml
      lr_schedule_phase: cosine_from_peak_to_75pct
    - name:              stage_2_anneal
      target_tokens:     10_000_000_000
      data_mix_config:   configs/data_mix_stage2.yaml
      lr_schedule_phase: cosine_from_75pct_to_25pct
    - name:              stage_3_distill
      target_tokens:     5_000_000_000
      data_mix_config:   configs/data_mix_stage3.yaml
      lr_schedule_phase: cosine_from_25pct_to_min
      distillation:
        enabled:         true
        teacher_model:   "Qwen/Qwen2.5-Coder-7B"
        temperature:     2.0
        beta:            0.5
        cache_top_k:     100
        teacher_logits_repo: "Quantum-Blade1/void-corpus-v1-teacher-logits"

data:
  tokenizer_repo:        "Quantum-Blade1/void-tokenizer"
  corpus_repo:           "Quantum-Blade1/void-corpus-v1"
  streaming:             true
  num_workers:           8
  prefetch_factor:       2
  pin_memory:            true
  persistent_workers:    true

evaluation:
  benchmarks:
    - humaneval
    - humaneval_fim
    - mbpp
    - mmlu
    - hellaswag
    - arc_easy
    - arc_challenge
    - piqa
    - winogrande
    - gsm8k_cot
    - void_cli_bench
  eval_at_steps:         [5000, 10000, 20000, 50000, 85000, 95000, 100000]
  eval_batch_size:       32
  fail_fast:
    humaneval_at_step_20000_min: 8       # halt if below

post_training:
  sft:
    dataset:             "Quantum-Blade1/void-sft-mix"    # to be built
    epochs:              3
    batch_size:          16
    lr:                  2.0e-5
    format:              chatml
  dpo:
    dataset:             "Quantum-Blade1/void-dpo-pairs"  # to be built
    beta:                0.1
    epochs:              1
    lr:                  5.0e-7
