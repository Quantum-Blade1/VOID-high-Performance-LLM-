[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "void"
version = "0.0.1"
description = "A differential-attention sub-1B code language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Krish Kumar Sharma", email = "quantum.chain01@gmail.com" }]

dependencies = [
    "torch>=2.2",
    "einops>=0.7",
    "numpy>=1.26",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "datasets>=2.20",
    "transformers>=4.44",
    "huggingface_hub>=0.24",
    "pyarrow>=15",
    "accelerate>=0.33",
    "pyyaml>=6",
    "tqdm>=4.66",
    "wandb>=0.17",
]

[project.optional-dependencies]
cuda = [
    "flash-attn>=2.6; sys_platform == 'linux'",
    "liger-kernel>=0.3; sys_platform == 'linux'",
    "bitsandbytes>=0.43; sys_platform == 'linux'",
]
eval = ["lm-eval>=0.4"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
void-train = "scripts.train:main"
void-data = "scripts.data:main"
void-eval = "scripts.eval:main"
void-export = "scripts.export:main"
void-bench = "scripts.bench:main"

[project.urls]
Homepage = "https://github.com/Quantum-Blade1/VOID-high-Performance-LLM-"

[tool.hatch.build.targets.wheel]
packages = ["void"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "paper"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "TCH"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "N802"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["flash_attn.*", "liger_kernel.*", "bitsandbytes.*", "wandb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["slow: >10s tests", "gpu: needs a GPU"]
