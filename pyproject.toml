[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "void"
version = "0.0.1"
description = "void_v1 — a differential-attention sub-1B code language model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Krish Kumar Sharma", email = "quantum.chain01@gmail.com" },
]
keywords = ["llm", "code-generation", "differential-attention", "pretraining"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core training
    "torch>=2.2.0",
    "einops>=0.7.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.0",

    # Data & tokenizer
    "tokenizers>=0.20.0",
    "datasets>=2.20.0",
    "transformers>=4.44.0",           # for teacher model + tokenizer utilities
    "huggingface_hub>=0.24.0",
    "pyarrow>=15.0.0",                 # parquet shards

    # Distillation / eval reference
    "sentencepiece>=0.2.0",

    # Training utilities
    "accelerate>=0.33.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
]

[project.optional-dependencies]
# CUDA-only extras
cuda = [
    "flash-attn>=2.6.0; sys_platform == 'linux'",
    "liger-kernel>=0.3.0; sys_platform == 'linux'",
    "bitsandbytes>=0.43.0; sys_platform == 'linux'",
]

# Evaluation harnesses
eval = [
    "lm-eval>=0.4.0",
    # bigcode-evaluation-harness installed from git; see docs/eval.md
]

# Development
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.20.0",
    "jupyterlab>=4.0.0",
]

# Deployment converters
deploy = [
    "auto-gptq>=0.7.0; sys_platform == 'linux'",
    # llama.cpp / gguf conversion tools installed as CLI, see docs/deploy.md
]

[project.scripts]
void-train = "scripts.train:main"
void-eval = "scripts.eval:main"
void-tokenizer = "scripts.train_tokenizer:main"

[project.urls]
Homepage = "https://github.com/Quantum-Blade1/VOID-high-Performance-LLM-"
Repository = "https://github.com/Quantum-Blade1/VOID-high-Performance-LLM-"

# -------------------------------------------------------------------
# Tool configuration
# -------------------------------------------------------------------

[tool.hatch.build.targets.wheel]
packages = ["void"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "paper"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",              # isort
    "N",              # pep8-naming
    "UP",             # pyupgrade
    "B",              # bugbear
    "SIM",            # simplify
    "TCH",            # type-checking imports
]
ignore = [
    "E501",           # line-length handled by formatter
    "B008",           # function-in-default-arg (fine for typer)
    "N812",           # allow lowercase imports for functional style
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501", "N802"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = false                       # start loose; tighten per module
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = false        # tighten later
plugins = []

[[tool.mypy.overrides]]
module = [
    "flash_attn.*",
    "liger_kernel.*",
    "bitsandbytes.*",
    "wandb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "slow: tests that take > 10s",
    "gpu: tests requiring a GPU",
    "integration: end-to-end integration tests",
]
